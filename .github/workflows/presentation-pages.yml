name: Publish TraceLab presentation
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/presentation-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - name: Validate workspace data and native imports
        run: node --test website/tracelab/workspace-store.test.mjs
      - name: Build static site
        run: node website/tracelab/build.mjs
        env:
          BASE_PATH: '/TraceLab'
          OUTPUT_DIR: 'presentation-dist'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: 'presentation-dist'
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
